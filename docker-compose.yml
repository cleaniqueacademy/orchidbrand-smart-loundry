services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanique_laundry_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cleanique_laundry
    volumes:
      - cleanique_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanique_laundry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cleanique-network

  # (Opsional jika ingin full-docker di masa depan)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleanique_laundry_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cleanique_laundry
      - JWT_SECRET=cleanique_super_secret_jwt_key_2026
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cleanique-network
    profiles:
      - full-stack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanique_laundry_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - VITE_PROXY_TARGET=http://backend:5000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    networks:
      - cleanique-network
    profiles:
      - full-stack

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: cleanique_laundry_landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-4174}:4174"
    volumes:
      - ./landing/src:/app/src
      - ./landing/index.html:/app/index.html
    networks:
      - cleanique-network
    profiles:
      - full-stack

volumes:
  cleanique_postgres_data:
    driver: local

networks:
  cleanique-network:
    driver: bridge
