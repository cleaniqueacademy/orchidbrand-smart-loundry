services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanique_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-cleanique_laundry}
    volumes:
      - cleanique_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cleanique_laundry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cleanique_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: cleanique_backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - APP_ORIGIN=${APP_ORIGIN:?APP_ORIGIN required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-cleanique_laundry}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AIVENE_API_KEY=${AIVENE_API_KEY:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      # Sesi WhatsApp Baileys & Uploads wajib persisten agar tidak hilang saat restart
      - cleanique_wa_sessions:/app/backend/auth_info_baileys
      - cleanique_uploads_data:/app/backend/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cleanique_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: cleanique_frontend
    restart: always
    ports:
      # Port aplikasi web di VPS (default port 8081, diproxy oleh Nginx reverse proxy host)
      - "127.0.0.1:${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cleanique_net

volumes:
  cleanique_postgres_data:
    driver: local
  cleanique_wa_sessions:
    driver: local
  cleanique_uploads_data:
    driver: local

networks:
  cleanique_net:
    driver: bridge
